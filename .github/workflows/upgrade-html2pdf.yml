name: Upgrade html2pdf Security Fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/upgrade-html2pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upgrade-html2pdf
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Upgrade html2pdf.js to patched version
        run: yarn add html2pdf.js@0.14.0 --exact --non-interactive

      - name: Adapt legacy Vue CLI build to local vendor script
        run: |
          cat > commands/copy-vendor.js <<'EOF'
          const { copyFileSync, mkdirSync } = require('fs')
          const { join } = require('path')

          const root = join(__dirname, '..')
          const vendorDir = join(root, 'public', 'vendor')
          mkdirSync(vendorDir, { recursive: true })

          const files = [
            [
              join(root, 'node_modules', '@turbodocx', 'html-to-docx', 'dist', 'html-to-docx.browser.js'),
              join(vendorDir, 'html-to-docx.browser.js'),
            ],
            [
              join(root, 'node_modules', 'html2pdf.js', 'dist', 'html2pdf.bundle.min.js'),
              join(vendorDir, 'html2pdf.bundle.min.js'),
            ],
          ]

          for (const [source, destination] of files) {
            copyFileSync(source, destination)
          }
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          data['scripts']['prestart'] = 'node ./commands/copy-vendor.js'
          data['scripts']['preserve'] = 'node ./commands/copy-vendor.js'
          data['scripts']['prebuild'] = 'node ./commands/copy-vendor.js'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index = Path('public/index.html')
          html = index.read_text(encoding='utf-8')
          marker = '  <div id="app"></div>'
          script = '  <script src="<%= BASE_URL %>vendor/html2pdf.bundle.min.js"></script>\n'
          if script not in html:
              if marker not in html:
                  raise SystemExit('Expected app marker was not found in public/index.html')
              html = html.replace(marker, script + marker, 1)
              index.write_text(html, encoding='utf-8')

          pdf = Path('src/pages/ExportPdf.vue')
          text = pdf.read_text(encoding='utf-8')
          text = text.replace("import html2pdf from 'html2pdf.js'\n", '', 1)
          needle = '    exportAndDownloadPdf(element, filename) {\n      const scale = window.devicePixelRatio'
          replacement = """    exportAndDownloadPdf(element, filename) {
              const html2pdf = window.html2pdf
              if (typeof html2pdf !== 'function') {
                this.isLoading = false
                this.exporting = false
                this.$message.error('PDF导出组件加载失败，请刷新页面后重试')
                return
              }
              const scale = window.devicePixelRatio"""
          if needle not in text:
              raise SystemExit('Expected PDF export method was not found')
          pdf.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

          node ./commands/copy-vendor.js

      - name: Run unit tests
        run: yarn test --runInBand

      - name: Build production bundle
        run: yarn build

      - name: Commit verified dependency update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json yarn.lock commands/copy-vendor.js public/index.html src/pages/ExportPdf.vue
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit'
            exit 0
          fi
          git commit -m 'security: update html2pdf.js to 0.14.0 [skip ci]'
          git push

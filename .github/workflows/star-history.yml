name: Star History

on:
  schedule:
    - cron: '0 6 * * *'
  watch:
    types: [started]
  workflow_dispatch:
  # Regenerate immediately when the generator / workflow itself changes
  push:
    branches: [master]
    paths:
      - '.github/scripts/generate-star-history.mjs'
      - '.github/workflows/star-history.yml'

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate star history SVGs
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN || github.token }}
          STAR_HISTORY_OWNER: ${{ github.repository_owner }}
          STAR_HISTORY_REPO: ${{ github.event.repository.name }}
        run: |
          set +e
          output="$(node .github/scripts/generate-star-history.mjs 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            echo 'generated=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "$output" | grep -Fq 'Repository has 0 stars'; then
            echo 'Repository has 0 stars; skipping chart update.'
            echo 'generated=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exit "$status"

      - name: Commit star history charts
        if: steps.generate.outputs.generated == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/shieldcn/star-chart-light.svg .github/shieldcn/star-chart-dark.svg
          if git diff --cached --quiet; then
            echo 'No star history changes'
            exit 0
          fi
          git commit -m 'chore: update star history chart [skip ci]'
          git push
